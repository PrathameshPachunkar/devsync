name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch or PR cancels the older run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: "1"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      # The API integration suite runs against real Postgres in CI
      # (locally it uses embedded PGlite).
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: devsync
          POSTGRES_PASSWORD: devsync
          POSTGRES_DB: devsync
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U devsync"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # version comes from package.json "packageManager"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Check migrations match the schema
        # Generating from an up-to-date schema writes nothing. Any new file
        # means someone changed schema.ts without committing a migration.
        run: |
          pnpm --filter @devsync/db exec drizzle-kit generate --name ci_drift_check
          if [ -n "$(git status --porcelain packages/db/drizzle)" ]; then
            echo "::error::packages/db/src/schema.ts changed without a migration. Run: pnpm --filter @devsync/db db:generate"
            git status --porcelain packages/db/drizzle
            exit 1
          fi

      - name: Lint and typecheck
        run: pnpm turbo run lint typecheck

      - name: Unit and integration tests
        run: pnpm turbo run test
        env:
          TEST_DATABASE_URL: postgres://devsync:devsync@localhost:5432/devsync

      - name: Build
        run: pnpm turbo run build

  e2e:
    name: End-to-end (Playwright)
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --filter @devsync/web exec playwright install --with-deps chromium

      - name: Build the web app
        run: pnpm turbo run build --filter=@devsync/web

      - name: Run end-to-end tests
        # Playwright starts the API (in-memory Postgres) and the production web build.
        run: pnpm --filter @devsync/web test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7
