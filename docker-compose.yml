# Optional: real Postgres for local development.
# The API falls back to embedded PGlite when DATABASE_URL is unset.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: devsync
      POSTGRES_PASSWORD: devsync
      POSTGRES_DB: devsync
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devsync"]
      interval: 5s
      retries: 10

volumes:
  pgdata: {}
